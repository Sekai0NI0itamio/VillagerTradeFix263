name: runtime-test

# GitHub-only runtime test: launches the real Minecraft 1.21.11 Fabric client
# headlessly (HeadlessMC + Xvfb via mc-runtime-test), which joins a
# single-player world, waits for chunks to load, then quits cleanly.
# Surviving this proves the mod loads at the title screen AND in-game.
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  java_version: 21

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --warning-mode all

      - name: Stage mod for test client
        run: |
          mkdir -p run/mods
          cp build/libs/villagertradefix263-*.jar run/mods/
          ls -la run/mods/

      - name: Run Minecraft 1.21.11 client (title screen + in-game world load)
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: 1.21.11
          modloader: fabric
          regex: .*fabric.*
          mc-runtime-test: fabric
          java: 21
          xvfb: "true"
          fabric-api: 0.141.4
          headlessmc-command: '--jvm "-DMcRuntimeGameTest=false"'

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-logs
          path: |
            run/logs/
            .minecraft/logs/
            **/latest.log
          if-no-files-found: warn
